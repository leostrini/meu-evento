<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador Eu Vou - 11ª Corrida da OAB</title>

  <style>
    :root {
      --bg-color: #070907;
      --card-bg: #111511;
      --accent-color: #b6ff00;
      --text-color: #ffffff;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1f2a13 0%, #050605 55%, #000 100%);
      color: var(--text-color);
      margin: 0;
      padding: 18px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: rgba(17, 21, 17, 0.96);
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      max-width: 460px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(182, 255, 0, 0.25);
    }

    h1 {
      font-size: 20px;
      margin: 0 0 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-color);
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 18px;
      font-size: 14px;
      line-height: 1.4;
    }

    #previewCanvas {
      width: 100%;
      height: auto;
      border-radius: 14px;
      background: #000;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
      margin-bottom: 18px;
      touch-action: none;
      cursor: grab;
    }

    #previewCanvas:active {
      cursor: grabbing;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: 0.2s ease;
    }

    .btn-upload {
      background: #20271c;
      color: #fff;
      border: 1px solid rgba(182, 255, 0, 0.35);
      margin-bottom: 16px;
    }

    .btn-download {
      background: var(--accent-color);
      color: #000;
      margin-top: 18px;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .controls {
      display: grid;
      gap: 14px;
      text-align: left;
      margin-top: 8px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 6px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-color);
    }

    .hint {
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.45;
      margin: 14px 0 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Gerador “Eu Vou!”</h1>
    <p class="subtitle">11ª Corrida da OAB - Canaã dos Carajás</p>

    <canvas id="previewCanvas" width="1080" height="1920"></canvas>

    <label for="fotoUpload" class="btn btn-upload">1. Selecionar minha foto</label>
    <input type="file" id="fotoUpload" accept="image/*" />

    <div class="controls">
      <div class="control-group">
        <label for="zoom">
          <span>Zoom da foto</span>
          <span id="zoomValue">100%</span>
        </label>
        <input type="range" id="zoom" min="0.5" max="4" step="0.01" value="1" />
      </div>

      <div class="control-group">
        <label for="posX">Mover para os lados</label>
        <input type="range" id="posX" min="-600" max="600" step="1" value="0" />
      </div>

      <div class="control-group">
        <label for="posY">Mover para cima/baixo</label>
        <input type="range" id="posY" min="-800" max="800" step="1" value="0" />
      </div>
    </div>

    <p class="hint">
      Dica: depois de escolher a foto, você também pode arrastar a imagem diretamente no preview.
    </p>

    <button id="btnDownload" class="btn btn-download">2. Baixar meu card</button>
  </div>

  <script>
    const canvas = document.getElementById("previewCanvas");
    const ctx = canvas.getContext("2d");

    const fotoUpload = document.getElementById("fotoUpload");
    const zoomInput = document.getElementById("zoom");
    const posXInput = document.getElementById("posX");
    const posYInput = document.getElementById("posY");
    const zoomValue = document.getElementById("zoomValue");
    const btnDownload = document.getElementById("btnDownload");

    const CANVAS_W = 1080;
    const CANVAS_H = 1920;

    /*
      Área transparente da máscara.
      Medidas já ajustadas para 1080x1920.
      Caso sua máscara mude, esses números podem precisar de pequeno ajuste.
    */
    const PHOTO_AREA = {
      x: 145,
      y: 445,
      w: 810,
      h: 1158,
      radius: 48
    };

    let userImage = null;
    let baseScale = 1;
    let isDragging = false;
    let lastPointer = { x: 0, y: 0 };

    const maskImage = new Image();

    /*
      Opção 1, recomendada:
      deixe o arquivo mascara.png na mesma pasta do index.html
    */
    maskImage.src = "mascara.png";

    /*
      Opção 2, se usar GitHub:
      use um link RAW real, neste formato:
      https://raw.githubusercontent.com/USUARIO/REPOSITORIO/main/mascara.png
    */

    maskImage.onload = drawCard;

    maskImage.onerror = function () {
      alert("Erro ao carregar a máscara. Confira se o arquivo mascara.png está na mesma pasta do index.html.");
    };

    function roundedRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawCoverImage(img, area, scaleMultiplier, offsetX, offsetY) {
      const scale = baseScale * scaleMultiplier;
      const imgW = img.width * scale;
      const imgH = img.height * scale;

      const centerX = area.x + area.w / 2 + offsetX;
      const centerY = area.y + area.h / 2 + offsetY;

      const drawX = centerX - imgW / 2;
      const drawY = centerY - imgH / 2;

      ctx.drawImage(img, drawX, drawY, imgW, imgH);
    }

    function drawCard() {
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

      ctx.fillStyle = "#050805";
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      if (userImage) {
        ctx.save();

        roundedRectPath(
          ctx,
          PHOTO_AREA.x,
          PHOTO_AREA.y,
          PHOTO_AREA.w,
          PHOTO_AREA.h,
          PHOTO_AREA.radius
        );

        ctx.clip();

        drawCoverImage(
          userImage,
          PHOTO_AREA,
          parseFloat(zoomInput.value),
          parseFloat(posXInput.value),
          parseFloat(posYInput.value)
        );

        ctx.restore();
      }

      if (maskImage.complete && maskImage.naturalWidth > 0) {
        ctx.drawImage(maskImage, 0, 0, CANVAS_W, CANVAS_H);
      }

      zoomValue.textContent = Math.round(parseFloat(zoomInput.value) * 100) + "%";
    }

    fotoUpload.addEventListener("change", function (e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (event) {
        const img = new Image();

        img.onload = function () {
          userImage = img;

          baseScale = Math.max(
            PHOTO_AREA.w / img.width,
            PHOTO_AREA.h / img.height
          );

          zoomInput.value = 1;
          posXInput.value = 0;
          posYInput.value = 0;

          drawCard();
        };

        img.src = event.target.result;
      };

      reader.readAsDataURL(file);
    });

    zoomInput.addEventListener("input", drawCard);
    posXInput.addEventListener("input", drawCard);
    posYInput.addEventListener("input", drawCard);

    function getPointerPosition(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      return {
        x: (clientX - rect.left) * (CANVAS_W / rect.width),
        y: (clientY - rect.top) * (CANVAS_H / rect.height)
      };
    }

    function startDrag(e) {
      if (!userImage) return;
      isDragging = true;
      lastPointer = getPointerPosition(e);
    }

    function moveDrag(e) {
      if (!isDragging || !userImage) return;
      e.preventDefault();

      const current = getPointerPosition(e);
      const dx = current.x - lastPointer.x;
      const dy = current.y - lastPointer.y;

      posXInput.value = parseFloat(posXInput.value) + dx;
      posYInput.value = parseFloat(posYInput.value) + dy;

      lastPointer = current;
      drawCard();
    }

    function endDrag() {
      isDragging = false;
    }

    canvas.addEventListener("mousedown", startDrag);
    canvas.addEventListener("mousemove", moveDrag);
    window.addEventListener("mouseup", endDrag);

    canvas.addEventListener("touchstart", startDrag, { passive: false });
    canvas.addEventListener("touchmove", moveDrag, { passive: false });
    window.addEventListener("touchend", endDrag);

    btnDownload.addEventListener("click", function () {
      if (!userImage) {
        alert("Selecione uma foto primeiro.");
        return;
      }

      const link = document.createElement("a");
      link.download = "eu-vou-11-corrida-oab.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    drawCard();
  </script>
</body>
</html>
